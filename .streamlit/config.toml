[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"

[server]
headless = true
port = 7860
maxUploadSize = 25
enableCORS = true
enableXsrfProtection = true
# Hugging Face embeds Spaces cross-site; file uploads need this XSRF cookie setting.
xsrfCookieSameSite = "none"
