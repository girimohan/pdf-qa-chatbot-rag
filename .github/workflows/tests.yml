name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6,<3"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
